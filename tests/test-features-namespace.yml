name: Test features namespace and oci-registry inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal devcontainer feature structure for validation
      - name: Create feature fixture
        run: |
          mkdir -p src/myfeature/
          cat > src/myfeature/devcontainer-feature.json << 'EOF'
          {
            "id": "myfeature",
            "version": "1.0.0",
            "name": "My Feature",
            "description": "A test feature for namespace/registry input coverage",
            "options": {}
          }
          EOF
          cat > src/myfeature/install.sh << 'EOF'
          #!/bin/sh
          echo "Hello from myfeature!"
          EOF
          chmod +x src/myfeature/install.sh

      - id: action
        name: Run action with oci-registry and features-namespace inputs
        uses: .
        with:
          validate-only: 'true'
          base-path-to-features: src
          oci-registry: ghcr.io
          features-namespace: test-owner/features
        continue-on-error: true

      - name: Assert action ran (validate-only with registry/namespace inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # validate-only should succeed or fail gracefully (not crash the runner)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
