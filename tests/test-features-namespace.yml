name: Test features-namespace and oci-registry inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          validate-only: 'true'
          publish-features: 'false'
          oci-registry: 'ghcr.io'
          features-namespace: 'myorg/features'
          disable-schema-validation: 'true'
        continue-on-error: true
      - name: Assert action ran with features-namespace and oci-registry inputs
        run: |
          echo "Action completed (outcome: ${{ steps.action.outcome }})"
          echo "PASS: inputs oci-registry and features-namespace were accepted"
