name: Test disable-schema-validation flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture features into workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src/features/hello"
          cp "$GITHUB_WORKSPACE/tests/fixtures/features/hello/devcontainer-feature.json" \
             "$GITHUB_WORKSPACE/src/features/hello/devcontainer-feature.json"

      - id: action
        name: Run action with schema validation disabled
        uses: .
        with:
          validate-only: 'true'
          disable-schema-validation: 'true'
          base-path-to-features: src/features

      - name: Assert action completed successfully
        run: |
          echo "Action completed with schema validation disabled"
          echo "PASS: disable-schema-validation mode ran without error"
