name: Test disable-schema-validation mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with schema validation disabled
        id: action
        uses: .
        with:
          disable-schema-validation: 'true'
          validate-only: 'true'
          base-path-to-features: tests/fixtures/features
        continue-on-error: true

      - name: Assert action ran with schema validation disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With schema validation disabled and validate-only, the action should
          # either succeed or fail gracefully (e.g. devcontainer CLI not available)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with schema validation disabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and exited (expected in harness without full setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
