name: Test validate-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in validate-only mode
        id: action
        uses: .
        with:
          validate-only: 'true'
          base-path-to-features: tests/fixtures/features
        continue-on-error: true

      - name: Assert action completed (validate-only)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # validate-only should succeed when schema is valid
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: validate-only completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail due to devcontainer CLI not installed or other env constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
