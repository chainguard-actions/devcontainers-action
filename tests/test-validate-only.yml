name: Test validate-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in validate-only mode
        id: action
        uses: .
        with:
          validate-only: 'true'
          base-path-to-features: tests/fixtures/features

      - name: Assert action completed successfully
        run: |
          echo "Action completed in validate-only mode"
          echo "PASS: validate-only mode ran without error"
