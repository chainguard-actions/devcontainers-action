name: Test templates-namespace and oci-registry-for-templates inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          validate-only: 'true'
          publish-templates: 'false'
          oci-registry-for-templates: 'ghcr.io'
          templates-namespace: 'myorg/templates'
          disable-schema-validation: 'true'
        continue-on-error: true
      - name: Assert action ran with templates-namespace and oci-registry-for-templates inputs
        run: |
          echo "Action completed (outcome: ${{ steps.action.outcome }})"
          echo "PASS: inputs oci-registry-for-templates and templates-namespace were accepted"
