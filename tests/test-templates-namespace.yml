name: Test templates namespace and oci-registry-for-templates inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal devcontainer template structure
      - name: Create template fixture
        run: |
          mkdir -p src/mytemplate/
          cat > src/mytemplate/devcontainer-template.json << 'EOF'
          {
            "id": "mytemplate",
            "version": "1.0.0",
            "name": "My Template",
            "description": "A test template for namespace/registry input coverage",
            "options": {}
          }
          EOF
          mkdir -p src/mytemplate/.devcontainer
          cat > src/mytemplate/.devcontainer/devcontainer.json << 'EOF'
          {
            "image": "mcr.microsoft.com/devcontainers/base:ubuntu"
          }
          EOF

      - id: action
        name: Run action with oci-registry-for-templates and templates-namespace inputs
        uses: .
        with:
          publish-templates: 'false'
          publish-features: 'false'
          validate-only: 'false'
          base-path-to-templates: src
          oci-registry-for-templates: ghcr.io
          templates-namespace: test-owner/templates
        continue-on-error: true

      - name: Assert action ran (no-publish with templates registry/namespace inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With no publishing enabled, the action should complete (success or failure)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
