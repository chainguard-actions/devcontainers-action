name: Test validate-only with invalid schema
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a devcontainer feature with intentionally invalid/missing required fields
      - name: Create invalid feature fixture
        run: |
          mkdir -p src/badfeature/
          cat > src/badfeature/devcontainer-feature.json <<'EOF'
          {
            "name": "Bad Feature"
          }
          EOF

      - id: action
        name: Run action in validate-only mode with invalid feature schema
        uses: .
        with:
          validate-only: 'true'
          base-path-to-features: src
        continue-on-error: true

      - name: Assert action ran (invalid schema may cause failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should complete (success or failure) — not crash the runner
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
