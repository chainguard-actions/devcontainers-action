name: Test validate-only with schema validation disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal devcontainer feature structure
      - name: Create feature fixture
        run: |
          mkdir -p src/myfeature/
          cat > src/myfeature/devcontainer-feature.json <<'EOF'
          {
            "id": "myfeature",
            "version": "1.0.0",
            "name": "My Feature",
            "description": "A test feature for schema-disabled validation",
            "options": {}
          }
          EOF
          cat > src/myfeature/install.sh <<'EOF'
          #!/bin/sh
          echo "My feature installed!"
          EOF
          chmod +x src/myfeature/install.sh

      - id: action
        name: Run action with validate-only and disable-schema-validation
        uses: .
        with:
          validate-only: 'true'
          disable-schema-validation: 'true'
          base-path-to-features: src
        continue-on-error: true

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
