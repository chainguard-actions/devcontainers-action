name: Test default inputs (no-op)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        # All inputs use defaults: publish-features=false, publish-templates=false,
        # validate-only=false, generate-docs=false
        continue-on-error: true

      - name: Assert action ran without crashing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With all defaults (no publish, no validate), the action should complete
          # (success or graceful failure) without an unhandled crash.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
