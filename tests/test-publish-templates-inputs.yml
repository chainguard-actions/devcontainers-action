name: Test publish-templates inputs (oci-registry-for-templates, templates-namespace)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal template structure
        run: |
          mkdir -p "$GITHUB_WORKSPACE/templates/hello"
          cat > "$GITHUB_WORKSPACE/templates/hello/devcontainer-template.json" <<'EOF'
          {
            "id": "hello",
            "version": "1.0.0",
            "name": "Hello Template",
            "description": "A minimal test template"
          }
          EOF
          mkdir -p "$GITHUB_WORKSPACE/templates/hello/.devcontainer"
          cat > "$GITHUB_WORKSPACE/templates/hello/.devcontainer/devcontainer.json" <<'EOF'
          {
            "name": "Hello",
            "image": "mcr.microsoft.com/devcontainers/base:ubuntu"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          publish-templates: 'true'
          base-path-to-templates: templates
          oci-registry-for-templates: ghcr.io
          templates-namespace: test-namespace/templates
          disable-repo-tagging: 'true'

      - name: Assert action ran with oci-registry-for-templates and templates-namespace inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with oci-registry-for-templates and templates-namespace inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — sentinel repo / no registry auth)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
