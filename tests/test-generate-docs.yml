name: Test generate-docs mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git for doc commits
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run action with generate-docs enabled
        id: action
        uses: .
        with:
          generate-docs: 'true'
          publish-features: 'false'
          publish-templates: 'false'
          base-path-to-features: tests/fixtures/features
        continue-on-error: true

      - name: Assert action ran with generate-docs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # generate-docs may succeed or fail depending on devcontainer CLI availability
          # but the action must not crash unexpectedly
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: generate-docs completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and exited (expected in harness without full publish setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
