name: Test generate-docs mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a devcontainer-feature.json fixture for docs generation
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/features-docs/my-feature"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/features-docs/my-feature/devcontainer-feature.json" <<'EOF'
          {
            "id": "my-feature",
            "version": "1.0.0",
            "name": "My Feature",
            "description": "A test dev container feature for docs generation",
            "options": {
              "version": {
                "type": "string",
                "proposals": ["latest", "1.0.0"],
                "default": "latest",
                "description": "Select the version to install"
              }
            }
          }
          EOF

      - id: action
        uses: .
        with:
          generate-docs: 'true'
          base-path-to-features: tests/fixtures/features-docs
        continue-on-error: true

      - name: Assert generate-docs ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: generate-docs completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no git commit access)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
