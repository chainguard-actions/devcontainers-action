name: Test validate-only with schema validation disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal devcontainer-feature.json fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/features-no-schema/my-feature"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/features-no-schema/my-feature/devcontainer-feature.json" <<'EOF'
          {
            "id": "my-feature",
            "version": "1.0.0",
            "name": "My Feature",
            "description": "A test dev container feature"
          }
          EOF

      - id: action
        uses: .
        with:
          validate-only: 'true'
          disable-schema-validation: 'true'
          base-path-to-features: tests/fixtures/features-no-schema
        continue-on-error: true

      - name: Assert action ran with schema validation disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with schema validation disabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no OCI credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
