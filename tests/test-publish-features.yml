name: Test publish-features mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a devcontainer-feature.json fixture for publishing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/features-publish/my-feature"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/features-publish/my-feature/devcontainer-feature.json" <<'EOF'
          {
            "id": "my-feature",
            "version": "1.0.0",
            "name": "My Feature",
            "description": "A test dev container feature for publishing"
          }
          EOF

      - id: action
        uses: .
        with:
          publish-features: 'true'
          base-path-to-features: tests/fixtures/features-publish
          oci-registry: ghcr.io
          features-namespace: test-namespace/features
          disable-repo-tagging: 'true'
        continue-on-error: true

      - name: Assert publish-features ran (success or graceful failure without credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: publish-features completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid OCI registry credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
